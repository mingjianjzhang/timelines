<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse No. 7</title>
</head>
<body>
<script src="../riso/riso.js"></script>
<script>
/*
 * A two-ink riso: teal (halftone dots) + fluorescent orange (grain).
 * Seamless 12-second loop — every periodic motion completes a whole number
 * of cycles per LOOP.
 */
const LOOP = 12;
const { tone, lerp, clamp, hash, blob, wobblyPoly, wobblyRect, knockout, noise } = Riso;
const TAU = Math.PI * 2;
const cyc = (t, n = 1) => (TAU * n * t) / LOOP;   // phase that loops n times per LOOP

Riso.mount((riso) => {
  const W = riso.width, H = riso.height;
  const M = 36, X0 = M, Y0 = M, X1 = W - M, Y1 = H - M - 40;
  const HZ = 330;                    // horizon
  const SUNX = 330;

  return (ink, t) => {
    const T = ink.teal, O = ink.fluorescentOrange, ALL = ink.all;
    ALL.forEach((c) => { c.save(); c.beginPath(); c.rect(X0, Y0, X1 - X0, Y1 - Y0); c.clip(); });

    // sky
    let g = T.createLinearGradient(0, Y0, 0, HZ);
    g.addColorStop(0, tone(0.85)); g.addColorStop(1, tone(0.15));
    T.fillStyle = g; T.fillRect(X0, Y0, X1 - X0, HZ - Y0);
    g = O.createLinearGradient(0, Y0 + 60, 0, HZ);
    g.addColorStop(0, tone(0)); g.addColorStop(1, tone(0.75));
    O.fillStyle = g; O.fillRect(X0, Y0, X1 - X0, HZ - Y0);

    // striped setting sun (stripes scroll downward, one stripe-period per loop)
    const R = 110;
    knockout([T], (c) => c.arc(SUNX, HZ, R, Math.PI, 0));
    O.fillStyle = tone(1); O.beginPath(); O.arc(SUNX, HZ, R, Math.PI, 0); O.fill();
    O.save(); O.beginPath(); O.arc(SUNX, HZ, R + 1, Math.PI, 0); O.clip();
    O.fillStyle = '#fff';
    const off = ((t / LOOP) * 4 % 1) * 22;
    for (let y = HZ - R + off, k = 0; y < HZ; y += 22, k++) {
      const h = lerp(1, 9, clamp((y - (HZ - R)) / R));
      O.fillRect(SUNX - R, y, R * 2, h);
    }
    O.restore();

    // clouds drifting (whole screen-widths per loop)
    for (let i = 0; i < 4; i++) {
      const span = X1 - X0 + 400;
      const x = X1 + 200 - ((t / LOOP + hash(i, 1)) % 1) * span;
      const y = 90 + hash(i, 2) * 120;
      knockout([O, T], (c) => { c.ellipse(x, y, 70 + hash(i, 3) * 60, 9 + hash(i, 4) * 6, 0, 0, TAU); }, 0.85);
      T.fillStyle = tone(0.35); T.beginPath(); T.ellipse(x + 12, y + 8, 60 + hash(i, 3) * 50, 4, 0, 0, TAU); T.fill();
    }

    // sea
    T.fillStyle = tone(0.72); T.fillRect(X0, HZ, X1 - X0, Y1 - HZ);
    O.fillStyle = tone(0.28); O.fillRect(X0, HZ, X1 - X0, Y1 - HZ);
    // wave lines: rows get taller and faster toward the viewer
    for (let row = 0; row < 26; row++) {
      const d = row / 25;
      const y = HZ + 4 + Math.pow(d, 1.6) * (Y1 - HZ);
      const amp = 1 + d * 7, len = 40 + d * 140;
      const ph = cyc(t, 1 + Math.floor(d * 3)) * (row % 2 ? 1 : -1);
      T.strokeStyle = '#fff'; T.lineWidth = 1 + d * 3.5;
      T.beginPath();
      for (let x = X0; x <= X1; x += 4) {
        const yy = y + Math.sin(x / len * TAU + ph + row) * amp + noise.noise2(x * 0.02, row) * amp;
        x === X0 ? T.moveTo(x, yy) : T.lineTo(x, yy);
      }
      T.stroke();
    }
    // sun glitter on the water
    O.fillStyle = tone(1);
    for (let i = 0; i < 70; i++) {
      const d = hash(i, 5);
      const y = HZ + 6 + Math.pow(d, 1.5) * (Y1 - HZ - 10);
      const spread = 30 + d * 170;
      const on = Math.sin(cyc(t, 3 + (i % 4)) + i * 2.1) > 0.1;
      if (!on) continue;
      const x = SUNX + (hash(i, 6) - 0.5) * spread * 2;
      const w = 8 + d * 40 * hash(i, 7);
      O.fillRect(x - w / 2, y, w, 1.5 + d * 3);
    }

    // sailboat
    {
      const bx = lerp(X1 + 60, X0 - 60, (t / LOOP) % 1), by = HZ + 70 + Math.sin(cyc(t, 6)) * 3;
      const tilt = Math.sin(cyc(t, 4)) * 0.06;
      for (const c of [T, O]) { c.save(); c.translate(bx, by); c.rotate(tilt); }
      knockout([T, O], (c) => { c.moveTo(0, -70); c.lineTo(34, -8); c.lineTo(0, -8); c.moveTo(-3, -60); c.lineTo(-30, -8); c.lineTo(-3, -8); });
      O.fillStyle = tone(1); wobblyPoly(O, [[0, -70], [34, -8], [0, -8]], { amp: 0.6, seed: 2 }); O.fill();
      T.fillStyle = tone(0.25); wobblyPoly(T, [[-3, -60], [-30, -8], [-3, -8]], { amp: 0.6, seed: 3 }); T.fill();
      T.fillStyle = tone(1);
      T.beginPath(); T.moveTo(-40, -6); T.lineTo(44, -6); T.lineTo(30, 8); T.lineTo(-30, 8); T.fill();
      T.fillRect(-2, -74, 3, 70);
      for (const c of [T, O]) c.restore();
    }

    // cliff + lighthouse
    {
      const cliff = [[X1, 250], [X1 - 60, 262], [X1 - 150, 276], [X1 - 210, 300], [X1 - 250, 360], [X1 - 290, 420], [X1 - 300, Y1], [X1, Y1]];
      knockout([O], (c) => cliff.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))));
      T.fillStyle = tone(1); wobblyPoly(T, cliff, { amp: 2, seed: 9 }); T.fill();
      O.fillStyle = tone(0.35);
      wobblyPoly(O, [[X1 - 150, 276], [X1 - 210, 300], [X1 - 250, 360], [X1 - 200, 330]], { amp: 2, seed: 4 }); O.fill();

      const lx = X1 - 110, base = 272, top = 120;
      const tower = [[lx - 24, base], [lx - 16, top], [lx + 16, top], [lx + 24, base]];
      knockout([T, O], (c) => tower.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))));
      O.save(); wobblyPoly(O, tower, { amp: 0.6, seed: 1 }); O.clip();
      O.fillStyle = tone(1);
      for (let k = 0; k < 4; k++) O.fillRect(lx - 30, top + 12 + k * 40, 60, 20);
      O.restore();
      // lantern room
      T.fillStyle = tone(1);
      T.fillRect(lx - 22, top - 6, 44, 7);
      T.beginPath(); T.moveTo(lx - 16, top - 34); T.lineTo(lx, top - 50); T.lineTo(lx + 16, top - 34); T.fill();
      knockout([T], (c) => c.rect(lx - 13, top - 33, 26, 27));
      O.fillStyle = tone(1); O.fillRect(lx - 13, top - 33, 26, 27);

      // sweeping beam: the lamp turns twice per loop
      const a = cyc(t, 2);
      const reach = Math.cos(a);               // +1 → pointing right, −1 → left
      const spreadY = 16 + 26 * Math.abs(Math.sin(a));
      const L = 900 * reach;
      const strength = 0.25 + 0.55 * Math.abs(reach);
      const beamPath = (c) => { c.moveTo(lx, top - 20); c.lineTo(lx + L, top - 20 - spreadY * 1.6); c.lineTo(lx + L, top - 20 + spreadY * 1.6); c.closePath(); };
      knockout([T], beamPath, strength * 0.7);
      O.fillStyle = tone(strength * 0.55); O.beginPath(); beamPath(O); O.fill();
      if (Math.sin(a) > 0.8) {  // facing us: a flash
        knockout([T], (c) => c.arc(lx, top - 20, 60, 0, TAU), (Math.sin(a) - 0.8) * 4);
      }
    }

    // gulls
    T.strokeStyle = tone(1); T.lineWidth = 2; T.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const gx = X0 + 120 + i * 60 + Math.sin(cyc(t, 1) + i) * 30;
      const gy = 150 + (i % 3) * 22 + Math.cos(cyc(t, 2) + i * 2) * 10;
      const f = Math.sin(cyc(t, 24) + i * 1.3) * 6;
      T.beginPath(); T.moveTo(gx - 9, gy - f); T.quadraticCurveTo(gx - 4, gy - 3, gx, gy); T.quadraticCurveTo(gx + 4, gy - 3, gx + 9, gy - f); T.stroke();
    }

    ALL.forEach((c) => c.restore());

    // caption
    T.fillStyle = tone(1);
    T.font = '900 26px Georgia, "Times New Roman", serif';
    T.letterSpacing = '2px';
    T.fillText('Lighthouse No. 7', X0, Y1 + 34);
    O.fillStyle = tone(1);
    O.font = '600 12px "Helvetica Neue", Helvetica, Arial, sans-serif';
    O.letterSpacing = '4px';
    O.textAlign = 'right';
    O.fillText('TWO-COLOUR RISOGRAPH  ·  TEAL + FLUO ORANGE', X1, Y1 + 30);
    O.textAlign = 'left';
  };
}, {
  title: 'lighthouse',
  width: 900,
  height: 640,
  inks: [
    { name: 'teal', screen: 'dots', cell: 5, angle: 22 },
    { name: 'fluorescentOrange', screen: 'grain' },
  ],
  paper: 'cream',
  fps: 24,
  boil: 6,
  misregister: 4,
  loop: LOOP,
  seed: 11,
});
</script>
</body>
</html>
